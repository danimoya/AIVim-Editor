<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AIVim companion</title><link rel="stylesheet" href="/static/app.css"><script src="/static/app.js" defer></script></head>
<body><main><h1>AIVim companion</h1><p>Review AI changes before applying them. Your source is sent only to the provider you select.</p>
<div class="controls"><label>Provider<select id="provider"></select></label><label>Model<select id="model"></select></label><label>Action<select id="action"><option value="explain">Explain</option><option value="improve">Improve</option><option value="generate">Generate</option><option value="analyze">Analyze</option><option value="query">Query</option></select></label><label>Language<input id="language" value="python" maxlength="64"></label></div>
<label for="upload">Open a local text file</label><input type="file" id="upload"><label for="code">Document</label><textarea id="code" spellcheck="false" wrap="off" aria-describedby="privacy"></textarea>
<p id="privacy">Context is optional. Generation can start with an empty document.</p>
<label for="instruction">Generation specification or question</label><textarea id="instruction" rows="3"></textarea>
<details><summary>Additional context that will be transmitted</summary><label for="context">Context</label><textarea id="context" rows="4"></textarea></details>
<div class="controls"><button id="submit">Ask AI</button><button id="cancel" disabled>Cancel request</button><button id="copy">Copy document</button><button id="download">Download document</button></div>
<p id="status" role="status" aria-live="polite">Loading provider capabilities…</p>
<section aria-labelledby="result-title"><h2 id="result-title">Response and proposal</h2><pre id="result" tabindex="0"></pre><div class="controls"><button id="apply" disabled>Apply proposal</button><button id="reject" disabled>Reject proposal</button><button id="undo" disabled>Undo applied proposal</button><button id="copy-result">Copy response</button></div></section>
</main></body></html>
