name: Dependency Update Automation

on:
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    name: Update Python Dependencies
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pip-tools

    - name: Create requirements.in from pyproject.toml
      run: |
        # Extract main dependencies from pyproject.toml
        python << 'EOF'
        import re
        from pathlib import Path

        content = Path('pyproject.toml').read_text()

        # Extract dependencies section
        deps_match = re.search(r'dependencies = \[(.*?)\]', content, re.DOTALL)
        if deps_match:
            deps_text = deps_match.group(1)
            # Clean up and extract package names
            deps = re.findall(r'"([^"]+)"', deps_text)

            with open('requirements.in', 'w') as f:
                f.write('# Main dependencies from pyproject.toml\n')
                for dep in deps:
                    # Remove platform markers for .in file
                    dep_clean = dep.split(';')[0].strip()
                    f.write(f'{dep_clean}\n')
        EOF

    - name: Compile pinned requirements
      run: |
        pip-compile requirements.in --upgrade --generate-hashes --output-file requirements-lock.txt

    - name: Compile dev requirements
      run: |
        # Extract dev dependencies
        python << 'EOF'
        import re
        from pathlib import Path

        content = Path('pyproject.toml').read_text()

        # Extract dev dependencies
        dev_match = re.search(r'\[project\.optional-dependencies\]\s+dev = \[(.*?)\]', content, re.DOTALL)
        if dev_match:
            deps_text = dev_match.group(1)
            deps = re.findall(r'"([^"]+)"', deps_text)

            with open('requirements-dev.in', 'w') as f:
                f.write('-c requirements-lock.txt\n')
                f.write('# Dev dependencies from pyproject.toml\n')
                for dep in deps:
                    dep_clean = dep.split(';')[0].strip()
                    f.write(f'{dep_clean}\n')
        EOF

        pip-compile requirements-dev.in --upgrade --generate-hashes --output-file requirements-dev-lock.txt

    - name: Run security audit
      run: |
        pip install safety
        safety check --file requirements-lock.txt --output json > security-audit.json || true

        # Check if there are any vulnerabilities
        if [ -f security-audit.json ]; then
          python << 'EOF'
        import json
        from pathlib import Path

        try:
            audit = json.loads(Path('security-audit.json').read_text())
            if 'vulnerabilities' in audit and audit['vulnerabilities']:
                print(f"⚠️ Found {len(audit['vulnerabilities'])} vulnerabilities!")
                for vuln in audit['vulnerabilities'][:5]:  # Show first 5
                    pkg = vuln.get('package_name', 'Unknown')
                    cve = vuln.get('vulnerability_id', 'N/A')
                    severity = vuln.get('severity', 'Unknown')
                    print(f"  - {pkg}: {cve} ({severity})")
            else:
                print("✅ No vulnerabilities found")
        except:
            print("Could not parse security audit")
        EOF
        fi
      continue-on-error: true

    - name: Check for changes
      id: changes
      run: |
        if git diff --quiet requirements-lock.txt requirements-dev-lock.txt; then
          echo "has_changes=false" >> $GITHUB_OUTPUT
        else
          echo "has_changes=true" >> $GITHUB_OUTPUT
        fi

    - name: Create Pull Request
      if: steps.changes.outputs.has_changes == 'true'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'deps: update Python dependencies'
        title: 'chore(deps): Update Python Dependencies'
        body: |
          ## Automated Dependency Update

          This PR updates Python dependencies to their latest compatible versions.

          ### Changes
          - Updated `requirements-lock.txt` with pinned versions and hashes
          - Updated `requirements-dev-lock.txt` with pinned dev dependencies

          ### Security
          Security audit results are included in the workflow logs.

          ### Testing
          Please ensure all tests pass before merging:
          - [ ] Unit tests pass
          - [ ] Integration tests pass
          - [ ] Security scans show no new vulnerabilities

          ---
          *This PR was automatically generated by the dependency update workflow*
        branch: deps/auto-update
        delete-branch: true
        labels: |
          dependencies
          python
          automated

    - name: Summary
      run: |
        echo "### Dependency Update Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ steps.changes.outputs.has_changes }}" == "true" ]; then
          echo "✅ Dependencies updated - PR created" >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ Dependencies are up to date" >> $GITHUB_STEP_SUMMARY
        fi
