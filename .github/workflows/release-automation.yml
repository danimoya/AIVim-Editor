name: Automated Release Management

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      pre_release:
        description: 'Create pre-release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create as draft'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      changelog: ${{ steps.changelog.outputs.changelog }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bump2version

    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Get current version
      id: current
      run: |
        CURRENT_VERSION=$(grep -oP 'version = "\K[^"]+' pyproject.toml)
        echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        echo "Current version: $CURRENT_VERSION"

    - name: Bump version
      id: bump
      run: |
        # Parse current version
        CURRENT_VERSION="${{ steps.current.outputs.version }}"
        IFS='.' read -r -a VERSION_PARTS <<< "$CURRENT_VERSION"
        MAJOR="${VERSION_PARTS[0]}"
        MINOR="${VERSION_PARTS[1]}"
        PATCH="${VERSION_PARTS[2]}"

        # Bump version based on input
        case "${{ github.event.inputs.version_bump }}" in
          major)
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            ;;
          minor)
            MINOR=$((MINOR + 1))
            PATCH=0
            ;;
          patch)
            PATCH=$((PATCH + 1))
            ;;
        esac

        NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "New version: $NEW_VERSION"

        # Update pyproject.toml
        sed -i "s/version = \"$CURRENT_VERSION\"/version = \"$NEW_VERSION\"/" pyproject.toml

        # Update VERSION file
        echo "$NEW_VERSION" > VERSION

    - name: Generate changelog
      id: changelog
      run: |
        # Get the previous tag
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

        if [ -z "$PREVIOUS_TAG" ]; then
          echo "No previous tag found, generating changelog from all commits"
          COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
        else
          echo "Generating changelog from $PREVIOUS_TAG"
          COMMITS=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
        fi

        # Categorize commits
        FEATURES=$(echo "$COMMITS" | grep -iE "^- (feat|feature):" || echo "")
        FIXES=$(echo "$COMMITS" | grep -iE "^- (fix|bugfix):" || echo "")
        DOCS=$(echo "$COMMITS" | grep -iE "^- (docs|documentation):" || echo "")
        CHORES=$(echo "$COMMITS" | grep -iE "^- (chore|ci|build|deps):" || echo "")
        BREAKING=$(echo "$COMMITS" | grep -iE "BREAKING CHANGE" || echo "")
        OTHER=$(echo "$COMMITS" | grep -viE "^- (feat|feature|fix|bugfix|docs|documentation|chore|ci|build|deps):" || echo "")

        # Build changelog
        CHANGELOG="## What's Changed\n\n"

        if [ -n "$BREAKING" ]; then
          CHANGELOG="${CHANGELOG}### ⚠️ Breaking Changes\n${BREAKING}\n\n"
        fi

        if [ -n "$FEATURES" ]; then
          CHANGELOG="${CHANGELOG}### ✨ New Features\n${FEATURES}\n\n"
        fi

        if [ -n "$FIXES" ]; then
          CHANGELOG="${CHANGELOG}### 🐛 Bug Fixes\n${FIXES}\n\n"
        fi

        if [ -n "$DOCS" ]; then
          CHANGELOG="${CHANGELOG}### 📚 Documentation\n${DOCS}\n\n"
        fi

        if [ -n "$CHORES" ]; then
          CHANGELOG="${CHANGELOG}### 🔧 Maintenance\n${CHORES}\n\n"
        fi

        if [ -n "$OTHER" ]; then
          CHANGELOG="${CHANGELOG}### Other Changes\n${OTHER}\n\n"
        fi

        # Add full changelog link
        if [ -n "$PREVIOUS_TAG" ]; then
          CHANGELOG="${CHANGELOG}\n**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...v${{ steps.bump.outputs.new_version }}"
        fi

        # Save to file and output
        echo -e "$CHANGELOG" > RELEASE_NOTES.md
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        cat RELEASE_NOTES.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Update CHANGELOG.md
      run: |
        NEW_VERSION="${{ steps.bump.outputs.new_version }}"
        RELEASE_DATE=$(date +%Y-%m-%d)

        # Create or update CHANGELOG.md
        if [ ! -f CHANGELOG.md ]; then
          echo "# Changelog" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "All notable changes to this project will be documented in this file." >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/)," >> CHANGELOG.md
          echo "and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html)." >> CHANGELOG.md
          echo "" >> CHANGELOG.md
        fi

        # Prepend new version to CHANGELOG.md
        {
          head -n 7 CHANGELOG.md
          echo ""
          echo "## [$NEW_VERSION] - $RELEASE_DATE"
          echo ""
          cat RELEASE_NOTES.md
          echo ""
          tail -n +8 CHANGELOG.md
        } > CHANGELOG.md.tmp

        mv CHANGELOG.md.tmp CHANGELOG.md

    - name: Commit version bump
      run: |
        git add pyproject.toml VERSION CHANGELOG.md
        git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}"
        git push origin main

    - name: Create Git tag
      run: |
        git tag -a "v${{ steps.bump.outputs.new_version }}" -m "Release v${{ steps.bump.outputs.new_version }}"
        git push origin "v${{ steps.bump.outputs.new_version }}"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.bump.outputs.new_version }}
        name: v${{ steps.bump.outputs.new_version }}
        body_path: RELEASE_NOTES.md
        draft: ${{ github.event.inputs.draft }}
        prerelease: ${{ github.event.inputs.pre_release }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Summary
      run: |
        echo "### Release Created! 🎉" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: v${{ steps.bump.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Type**: ${{ github.event.inputs.version_bump }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Pre-release**: ${{ github.event.inputs.pre_release }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Draft**: ${{ github.event.inputs.draft }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "The PyPi publishing workflow will now trigger automatically." >> $GITHUB_STEP_SUMMARY
