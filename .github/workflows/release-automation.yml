name: Prepare GitHub release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create as a draft (publish explicitly after review)
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install packaging
      - run: python scripts/bump_version.py --validate
      - name: Read committed release identity
        id: identity
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          from bump_version import version, tag_for
          from packaging.version import Version
          value = version()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write(f'version={value}\ntag={tag_for(value)}\n')
              handle.write(f'prerelease={str(Version(value).is_prerelease).lower()}\n')
          PY
      - name: Create release from the committed version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          IS_PRERELEASE: ${{ steps.identity.outputs.prerelease }}
          IS_DRAFT: ${{ inputs.draft }}
        run: |
          options=()
          if [ "$IS_PRERELEASE" = true ]; then options+=(--prerelease); fi
          if [ "$IS_DRAFT" = true ]; then options+=(--draft); fi
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
            --title "AIVim $RELEASE_VERSION" --generate-notes "${options[@]}"
