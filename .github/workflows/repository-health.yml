name: Repository Health Check

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  health-check:
    name: Repository Health Monitoring
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install analysis tools
      run: |
        python -m pip install --upgrade pip
        pip install radon lizard bandit safety

    - name: Check code complexity
      id: complexity
      run: |
        echo "### Code Complexity Analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Cyclomatic Complexity
        echo "#### Cyclomatic Complexity (Radon)" >> $GITHUB_STEP_SUMMARY
        radon cc aivim -a -nb >> complexity.txt
        cat complexity.txt >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Maintainability Index
        echo "#### Maintainability Index" >> $GITHUB_STEP_SUMMARY
        radon mi aivim -nb >> maintainability.txt
        cat maintainability.txt >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Check for high complexity functions
        HIGH_COMPLEXITY=$(radon cc aivim -n C -s)
        if [ -n "$HIGH_COMPLEXITY" ]; then
          echo "⚠️ High complexity functions found" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$HIGH_COMPLEXITY" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ No high complexity functions" >> $GITHUB_STEP_SUMMARY
        fi
      continue-on-error: true

    - name: Check code duplication
      run: |
        echo "### Code Duplication Analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Use lizard for duplication checking
        lizard aivim -l python --CCN 15 >> lizard.txt || true
        cat lizard.txt >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
      continue-on-error: true

    - name: Security vulnerability scan
      run: |
        echo "### Security Analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Bandit security scan
        bandit -r aivim -f json -o bandit.json || true
        bandit -r aivim -f txt >> security.txt || true

        # Count issues by severity
        if [ -f bandit.json ]; then
          python << 'EOF'
        import json
        from pathlib import Path

        try:
            data = json.loads(Path('bandit.json').read_text())
            results = data.get('results', [])

            high = sum(1 for r in results if r.get('issue_severity') == 'HIGH')
            medium = sum(1 for r in results if r.get('issue_severity') == 'MEDIUM')
            low = sum(1 for r in results if r.get('issue_severity') == 'LOW')

            print(f"#### Bandit Security Scan")
            print(f"- 🔴 High: {high}")
            print(f"- 🟡 Medium: {medium}")
            print(f"- 🟢 Low: {low}")
            print(f"- **Total**: {len(results)}")

            if high > 0:
                print("\n⚠️ **High severity issues found!**")
                for r in results[:3]:  # Show first 3
                    if r.get('issue_severity') == 'HIGH':
                        print(f"- {r.get('test_id')}: {r.get('issue_text')} ({r.get('filename')}:{r.get('line_number')})")
        except Exception as e:
            print(f"Could not parse bandit results: {e}")
        EOF
        fi >> $GITHUB_STEP_SUMMARY
      continue-on-error: true

    - name: Dependency health check
      run: |
        echo "### Dependency Health" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Install dependencies
        pip install -e . || true

        # Check for outdated packages
        pip list --outdated --format=json > outdated.json || true

        if [ -f outdated.json ]; then
          python << 'EOF'
        import json
        from pathlib import Path

        try:
            outdated = json.loads(Path('outdated.json').read_text())
            if outdated:
                print(f"#### Outdated Packages ({len(outdated)})")
                print("| Package | Current | Latest |")
                print("|---------|---------|--------|")
                for pkg in outdated[:10]:  # Show first 10
                    print(f"| {pkg['name']} | {pkg['version']} | {pkg['latest_version']} |")
                if len(outdated) > 10:
                    print(f"\n*...and {len(outdated) - 10} more*")
            else:
                print("✅ All dependencies are up to date")
        except Exception as e:
            print(f"Could not check outdated packages: {e}")
        EOF
        fi >> $GITHUB_STEP_SUMMARY

        # Safety check
        safety check --json > safety.json || true
        if [ -f safety.json ]; then
          python << 'EOF'
        import json
        from pathlib import Path

        try:
            data = json.loads(Path('safety.json').read_text())
            vulns = data.get('vulnerabilities', [])
            if vulns:
                print(f"\n#### 🚨 Security Vulnerabilities ({len(vulns)})")
                print("| Package | Vulnerability | Severity |")
                print("|---------|---------------|----------|")
                for v in vulns[:5]:
                    pkg = v.get('package_name', 'Unknown')
                    vuln_id = v.get('vulnerability_id', 'N/A')
                    severity = v.get('severity', 'Unknown')
                    print(f"| {pkg} | {vuln_id} | {severity} |")
                if len(vulns) > 5:
                    print(f"\n*...and {len(vulns) - 5} more*")
            else:
                print("\n✅ No known vulnerabilities in dependencies")
        except Exception as e:
            print(f"\nCould not check vulnerabilities: {e}")
        EOF
        fi >> $GITHUB_STEP_SUMMARY
      continue-on-error: true

    - name: Check test coverage
      run: |
        echo "### Test Coverage" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        pip install pytest pytest-cov
        pytest tests/ --cov=aivim --cov-report=term --cov-report=json -q || true

        if [ -f coverage.json ]; then
          python << 'EOF'
        import json
        from pathlib import Path

        try:
            data = json.loads(Path('coverage.json').read_text())
            total = data.get('totals', {})
            percent = total.get('percent_covered', 0)

            print(f"**Overall Coverage**: {percent:.2f}%")

            if percent < 20:
                print("🔴 Coverage is very low - consider adding more tests")
            elif percent < 50:
                print("🟡 Coverage is moderate - room for improvement")
            elif percent < 80:
                print("🟢 Coverage is good")
            else:
                print("✅ Coverage is excellent")

            # Show files with low coverage
            files = data.get('files', {})
            low_coverage = [(f, d['summary']['percent_covered'])
                           for f, d in files.items()
                           if d['summary']['percent_covered'] < 30]

            if low_coverage:
                print("\n#### Files with Low Coverage (<30%)")
                print("| File | Coverage |")
                print("|------|----------|")
                for f, cov in sorted(low_coverage, key=lambda x: x[1])[:10]:
                    print(f"| {f} | {cov:.1f}% |")
        except Exception as e:
            print(f"Could not parse coverage data: {e}")
        EOF
        fi >> $GITHUB_STEP_SUMMARY
      continue-on-error: true

    - name: Repository statistics
      run: |
        echo "### Repository Statistics" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Count lines of code
        echo "#### Code Statistics" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        find aivim -name "*.py" | xargs wc -l | tail -1 >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

        # Recent commits
        echo "#### Recent Activity" >> $GITHUB_STEP_SUMMARY
        echo "- Last commit: $(git log -1 --format='%cr by %an')" >> $GITHUB_STEP_SUMMARY
        echo "- Commits (last 7 days): $(git log --since='7 days ago' --oneline | wc -l)" >> $GITHUB_STEP_SUMMARY

        # Open issues/PRs (if we can access them)
        echo "" >> $GITHUB_STEP_SUMMARY

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: health-check-reports
        path: |
          complexity.txt
          maintainability.txt
          security.txt
          bandit.json
          outdated.json
          safety.json
          coverage.json
        retention-days: 30
      if: always()

    - name: Final summary
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "*Health check completed at $(date)*" >> $GITHUB_STEP_SUMMARY
