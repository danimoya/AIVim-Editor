name: Qualification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- aivim/web/static/app.js aivim/web/static/THIRD_PARTY_LICENSES.txt
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.11', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/../aivim-browsers
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test,build]' 'flake8>=7,<8'
      - run: python -m flake8 aivim --select=E9,F63,F7,F82 --show-source
      - if: runner.os == 'Linux'
        run: python -m playwright install --with-deps --only-shell chromium
      - if: runner.os != 'Linux'
        run: python -m playwright install --only-shell chromium
      - run: python scripts/check_source.py
      - run: python scripts/bump_version.py --validate
      - run: python -m pytest -o addopts= -p no:cacheprovider --timeout=120 verification
      - run: python -m unittest tests.test_buffer tests.test_history tests.test_utils
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install the built wheel
        shell: bash
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Installed package smoke outside source
        shell: bash
        run: |
          cp scripts/installed_smoke.py "$RUNNER_TEMP/aivim-installed-smoke.py"
          cd "$RUNNER_TEMP"
          python aivim-installed-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
