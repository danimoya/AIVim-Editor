name: Qualification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.11', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/../aivim-browsers
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test,build]'
      - if: runner.os == 'Linux'
        run: python -m playwright install --with-deps --only-shell chromium
      - if: runner.os != 'Linux'
        run: python -m playwright install --only-shell chromium
      - run: python scripts/check_source.py
      - run: python scripts/bump_version.py --validate
      - run: python -m pytest -o addopts= -p no:cacheprovider verification
      - run: python -m unittest tests.test_buffer tests.test_history tests.test_utils
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall dist/aivim-0.6.0-py3-none-any.whl
      - name: Installed package smoke outside source
        shell: bash
        run: |
          cp scripts/installed_smoke.py "$RUNNER_TEMP/aivim-installed-smoke.py"
          cd "$RUNNER_TEMP"
          python aivim-installed-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
