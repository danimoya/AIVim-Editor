name: Publish AIVim to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read
  id-token: write

jobs:
  pre-publish-checks:
    name: Pre-publish Security and Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          pyproject.toml

    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-publish-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-publish-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e .
        pip install bandit safety pytest pytest-cov twine check-manifest

    - name: Security scan with bandit
      run: |
        bandit -r aivim -ll -i -x ./aivim/tests

    - name: Check dependencies for vulnerabilities
      run: |
        safety check --json

    - name: Run critical tests
      run: |
        pytest tests/ -v -m "not slow" --tb=short
      env:
        PYTHONPATH: ${{ github.workspace }}

    - name: Check manifest
      run: |
        check-manifest

    - name: Validate version consistency
      run: |
        python -c "
        import re
        import sys
        from pathlib import Path

        # Read version from pyproject.toml
        pyproject = Path('pyproject.toml').read_text()
        version_match = re.search(r'version = \"(.+?)\"', pyproject)
        if not version_match:
            print('ERROR: Could not find version in pyproject.toml')
            sys.exit(1)

        pyproject_version = version_match.group(1)
        print(f'pyproject.toml version: {pyproject_version}')

        # Check if VERSION file exists
        version_file = Path('VERSION')
        if version_file.exists():
            file_version = version_file.read_text().strip()
            print(f'VERSION file version: {file_version}')
            if pyproject_version != file_version:
                print('ERROR: Version mismatch between pyproject.toml and VERSION file')
                sys.exit(1)

        print('Version validation passed')
        "

  build:
    name: Build Distribution
    needs: pre-publish-checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-build-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-build-
          ${{ runner.os }}-pip-

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip build twine

    - name: Build package
      run: |
        python -m build

    - name: Verify package
      run: |
        twine check dist/*

    - name: List package contents
      run: |
        tar -tzf dist/*.tar.gz | head -20

    - name: Store distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
        retention-days: 7

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/aivim/

    steps:
    - name: Download distribution packages
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true
        verbose: true

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aivim/

    steps:
    - name: Download distribution packages
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        verbose: true

  post-publish-validation:
    name: Post-publish Installation Test
    needs: [publish-to-pypi]
    if: success()
    runs-on: ubuntu-latest

    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Wait for package availability
      run: |
        sleep 60

    - name: Install from PyPI
      run: |
        pip install aivim

    - name: Verify installation
      run: |
        python -c "import aivim; print(f'AIVim version installed: {aivim.__version__ if hasattr(aivim, \"__version__\") else \"unknown\"}')"
        aivim --help || echo "CLI executed"

  create-github-release-assets:
    name: Upload Assets to GitHub Release
    needs: [publish-to-pypi]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
    - name: Download distribution packages
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}