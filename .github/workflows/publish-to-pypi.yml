name: Publish AIVim to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build distributions
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/../aivim-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[test,build]'
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_source.py
      - run: python scripts/bump_version.py --validate
      - name: Validate release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, 'scripts')
          from bump_version import tag_for, version
          assert os.environ['RELEASE_TAG'] == tag_for(version()), 'Tag/version mismatch'
          PY
      - run: python -m pytest -o addopts= -p no:cacheprovider --timeout=120 verification
      - run: python -m unittest tests.test_buffer tests.test_history tests.test_utils
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify installed wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/aivim-wheel"
          "$RUNNER_TEMP/aivim-wheel/bin/python" -m pip install dist/*.whl
          cp scripts/installed_smoke.py "$RUNNER_TEMP/aivim-installed-smoke.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/aivim-wheel/bin/python" aivim-installed-smoke.py
      - name: Verify sdist can build independently
        run: |
          mkdir "$RUNNER_TEMP/aivim-sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/aivim-sdist"
          python -m build --wheel --outdir "$RUNNER_TEMP/sdist-wheel" "$RUNNER_TEMP"/aivim-sdist/aivim-*
      - run: sha256sum dist/* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: SHA256SUMS

  publish:
    name: Publish verified distributions
    needs: build
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'release' && 'pypi' || inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        if: github.event_name == 'release' || inputs.environment == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.environment == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          attestations: false

  release-assets:
    needs: [build, publish]
    if: always() && github.event_name == 'release' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: checksums
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" dist/* SHA256SUMS --clobber
